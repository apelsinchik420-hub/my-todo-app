name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libmpdec-dev
          pip install --user --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
          
          buildozer android update || true
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74bf36700489da11f2\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8498132de561f5ec461a3d14d9a1b9fd0dc81c7c" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Полная тишина: пишем абсолютно весь вывод (включая harfbuzz) в файл на сервере
          stdbuf -oL -eL buildozer android debug > buildozer_full.log 2>&1 || (tail -n 200 buildozer_full.log && exit 1)

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-todo-app-apk
          path: bin/*.apk
