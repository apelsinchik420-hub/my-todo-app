name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libmpdec-dev
          pip install --user --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
          
          # Инициализируем buildozer, чтобы он создал правильную структуру папок
          buildozer android update || true
          
          # Исправляем проблему отсутствия sdkmanager, принудительно прописав соглашение
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74bf36700489da11f2\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8498132de561f5ec461a3d14d9a1b9fd0dc81c7c" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Запускаем чистую сборку
          buildozer android debug
